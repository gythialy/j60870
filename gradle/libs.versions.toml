[versions]
junit = "5.14.4"
awaitility = "4.3.0"
spotless = "8.7.0"
mockito="5.23.0"
jacoco = "0.8.15"

[libraries]
junit = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine"}
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
awaitility = { group = "org.awaitility", name = "awaitility", version.ref = "awaitility" }
jacoco-ant = { group = "org.jacoco", name = "org.jacoco.ant", version.ref = "jacoco" }
jacoco-agent = { group = "org.jacoco", name = "org.jacoco.agent", version.ref = "jacoco" }

[plugins]
java = { id = "java" }
jacoco = { id = "jacoco" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }