# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # JUnit 6 requires a Java 17 runtime baseline, but this fork still builds
      # against Java 11 (see javaVersion in gradle.properties). Upgrading the
      # BOM to 6.x fails :compileTestJava with
      # "junit-jupiter-api:6.x is only compatible with JVM runtime version 17 or newer".
      - dependency-name: "org.junit:junit-bom"
        update-types: [ "version-update:semver-major" ]
